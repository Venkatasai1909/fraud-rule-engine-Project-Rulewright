spring.application.name=fraud-rule-engine
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fraud_rules}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
fraud.rules.refresh-interval-ms=${RULESET_REFRESH_INTERVAL_MS:1000}
management.endpoints.web.exposure.include=health,info,metrics

# Task 2 behavioural features: memory is the zero-infrastructure default; set to redis in deployment.
fraud.features.store=${FEATURE_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=100ms
spring.data.redis.timeout=100ms
